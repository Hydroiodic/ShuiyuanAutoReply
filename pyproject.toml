[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shuiyuan-auto-reply"
version = "0.1.0"
description = "A project for automatic replies using LangChain and OpenRouter."
readme = "README.md"
authors = [{ name = "Hydroiodic_Acid", email = "liao_chengfan@sjtu.edu.cn" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "apscheduler",
    "dacite",
    "httpx[socks]",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langchain-mcp-adapters",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "neomodel",
    "numpy",
    "openai",
    "pandas",
    "pillow",
    "pydantic",
    "python-dotenv",
    "sentence-transformers",
    "skia-python",
    "sqlalchemy[asyncio]",
    "yarl",
]

[project.optional-dependencies]
dev = ["aiosqlite", "black", "build", "isort", "pre-commit", "pytest", "ruff"]
server = ["fastapi[all]"]

[project.urls]
Repository = "https://github.com/Hydroiodic/ShuiyuanAutoReply"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shuiyuan_auto_reply*"]

[tool.setuptools.package-data]
shuiyuan_auto_reply = [
    "assets/tarot_data.json",
    "assets/themes/phigros/*.png",
    "assets/themes/phigros/*.txt",
    "assets/themes/phigros/*.ttf",
    "assets/tarot_img/*.jpg",
    "assets/fonts/Noto_Color_Emoji/*.ttf",
    "assets/fonts/Noto_Color_Emoji/*.txt",
    "assets/fonts/Noto_Sans_SC/OFL.txt",
    "assets/fonts/Noto_Sans_SC/static/NotoSansSC-Bold.ttf",
    "assets/fonts/Noto_Sans_SC/static/NotoSansSC-Regular.ttf",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
combine_as_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Formatting (including line length) is handled by black and isort
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
